spring.application.name=picket
server.port=3000
spring.config.import=optional:file:./config/secret.properties

# 인증:/user/api/sign-in + HttpSession 으로 직접 처리
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/picket
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# mybatis
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-handlers-package=com.heeji.picket.config.typehandler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=false
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# log
logging.level.root=INFO
logging.level.org.mybatis=DEBUG
logging.level.org.mybatis.spring=DEBUG
logging.level.org.apache.ibatis=DEBUG
logging.level.com.heeji=DEBUG

spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/

# views
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.view.cache=false

# oauth
picket.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
picket.oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/user/api/kakaoLogin}

# 결제 리다이렉트 주소
picket.app.base-url=${APP_BASE_URL:}

# 업로드
picket.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# payments (toss)
picket.payments.toss.api-url=${TOSS_API_URL:https://api.tosspayments.com}
picket.payments.toss.client-key=${TOSS_CLIENT_KEY:}
picket.payments.toss.secret-key=${TOSS_SECRET_KEY:}

# dev
spring.devtools.livereload.enabled=true
